<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Монтажная</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: офис-сцена сверху (5 столов + ассистент), под ней дедлайны и доска задач по статусам */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#1A2030; --muted:#5E6678; --line:#D6DAE3;
  --wall:#DDE2EA; --floor:#C9CFDA; --desk:#8A6F55; --desk-top:#A3866A; --screen:#1E2638; --screen-on:#7FD3E0;
  --accent:#0E7C86; --stage:#2B2740;
  --me:#E0702B; --elvina:#C4417F; --ruslan:#3A68C9; --danila:#3E9452; --claude:#B08A3E; --elmira:#178F8B;
  --bad:#C63A3A; --warn:#C98A12; --ok:#2F8A4E;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161F; --surface:#1A202C; --surface-2:#212836; --ink:#E6E9F0; --muted:#98A0B3; --line:#2E3646;
  --wall:#1E2533; --floor:#171C27; --desk:#5E4A38; --desk-top:#77604A; --screen:#0B0F17; --screen-on:#5CC4D3;
  --accent:#3FB6C0; --stage:#0E0C18; --me:#F08A48; --elvina:#E06BA2; --ruslan:#6C93E6; --danila:#62B776; --claude:#D1AE62; --elmira:#3FC2BC;
  --bad:#E46464; --warn:#E0A63A; --ok:#5BBE7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161F; --surface:#1A202C; --surface-2:#212836; --ink:#E6E9F0; --muted:#98A0B3; --line:#2E3646;
  --wall:#1E2533; --floor:#171C27; --desk:#5E4A38; --desk-top:#77604A; --screen:#0B0F17; --screen-on:#5CC4D3;
  --accent:#3FB6C0; --stage:#0E0C18; --me:#F08A48; --elvina:#E06BA2; --ruslan:#6C93E6; --danila:#62B776; --claude:#D1AE62; --elmira:#3FC2BC;
  --bad:#E46464; --warn:#E0A63A; --ok:#5BBE7A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.beer{display:flex;gap:10px;align-items:center;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.beer .mug{flex:none;width:22px;height:26px;position:relative}
.beer .mug::before{content:"";position:absolute;left:0;bottom:0;width:16px;height:20px;border-radius:2px 2px 4px 4px;background:var(--warn)}
.beer .mug::after{content:"";position:absolute;left:-1px;top:0;width:18px;height:7px;border-radius:5px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.beer .h{position:absolute;right:0;top:9px;width:7px;height:11px;border:3px solid var(--warn);border-left:0;border-radius:0 6px 6px 0}
.beer small{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.beer span{font-size:13px;line-height:1.35}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=datetime-local],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600}
button.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
a.btn{display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600;color:var(--ink);background:var(--surface)}
.prio{font-size:10px;font-weight:700;color:var(--bad)}
.blk{font-size:11px;color:var(--bad)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.kv a{color:var(--accent)}
.status button{font-size:12px;padding:3px 8px;margin-left:6px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.bub:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- isometric office ---- */
.stage{position:relative;border-radius:14px;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:#FFFDF6;color:#1A2030;border:2px solid #1A2030;
  border-radius:4px;padding:3px 6px;font-size:11px;line-height:1.25;width:max-content;max-width:132px;box-shadow:2px 2px 0 rgba(0,0,0,.35);font-family:var(--f-body)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-4px;border:4px solid transparent;border-top-color:#1A2030;border-bottom:0}
.bub b{font-family:var(--f-mono);font-size:10px;display:flex;justify-content:space-between;gap:6px}
.bub .bt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub .pb{height:3px;background:#E3E0D6;margin-top:3px}.bub .pb i{display:block;height:100%;background:var(--c)}
.bub.idle{opacity:.85}
.bub[data-k=me]{transform:translate(-88%,-100%)}.bub[data-k=me]::after{left:88%}
.bub[data-k=claude]{transform:translate(-12%,-100%)}.bub[data-k=claude]::after{left:12%}.bub.sel{outline:2px solid var(--c);outline-offset:1px}
.zone{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#fff;
  background:rgba(20,18,30,.55);padding:1px 6px;border-radius:3px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend button{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px}
.legend button[aria-pressed=true]{border-color:var(--ink)}
.legend .dot{width:9px;height:9px;border-radius:2px;background:var(--c)}
@media (max-width:640px){.bub .bt,.bub .pb{display:none}.bub{padding:2px 4px}.zone{font-size:8px}}

/* pipeline */
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.pipe b{color:var(--ink);font-weight:600}
.pipe .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* deadlines */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-family:var(--f-display);font-size:15px;font-weight:500;margin:0 0 10px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.dli{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface-2);cursor:pointer;min-width:0}
.dli .when{font-family:var(--f-mono);font-size:12px;font-weight:600;min-width:64px;font-variant-numeric:tabular-nums}
.dli .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.late{color:var(--bad)}.soon{color:var(--warn)}.fine{color:var(--ok)}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .proj{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.card .tt{font-weight:600;overflow-wrap:anywhere}
.card .meta{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ex{font-size:10px;border:1px dashed var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.empty{color:var(--muted);font-size:12px;padding:8px 2px}
.note{font-size:12px;color:var(--muted)}

/* drawer */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:flex;justify-content:flex-end;z-index:20}
.sheet .in{background:var(--surface);width:min(440px,100%);height:100%;overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--f-display);font-size:17px;font-weight:500;margin:0}
.row{display:flex;flex-direction:column;gap:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:5px 9px;font-size:12px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cm{background:var(--surface-2);border-radius:8px;padding:7px 9px;font-size:13px}
.cm b{font-size:12px}
.cm time{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}
.status{font-size:12px;color:var(--muted)}

@media (max-width:820px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{padding:5px 10px;font-size:12px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.br{font-size:10px;font-weight:700;letter-spacing:.06em;padding:0 5px;border-radius:4px;background:color-mix(in srgb,var(--elmira) 18%,transparent);color:var(--elmira)}
.pipes{display:flex;flex-direction:column;gap:6px}
@media (max-width:480px){.board{grid-template-columns:1fr}.row2{grid-template-columns:1fr}h1{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <h1>Монтажная</h1>
      <p class="sub">Задачи берутся из общей Google Таблицы. Кто что делает прямо сейчас. Нажми на человечка, чтобы увидеть его задачи. Без задач команда отдыхает в лаунже или на кухне.</p>
    </div>
    <div class="bar">
      <a class="btn primary" href="https://docs.google.com/spreadsheets/d/16e-TyCsfDIs6V1PEPcdWJkQosVCYE6ZmqKBcz_ZIsMw/edit" target="_blank" rel="noopener">+ Задача в таблице</a>
      <div class="beer"><div class="mug" aria-hidden="true"><i class="h"></i></div><div><small>Пивная мудрость дня</small><span id="beer"></span></div></div>
    </div>
  </header>

  <section class="stage" aria-label="Офис в пиксель-арте: рабочие столы, SMM-угол, лаундж, кухня">
    <canvas id="scene" width="420" height="292"></canvas>
    <div class="ov" id="ov"></div>
  </section>
  <div class="legend" id="legend"></div>

  <div class="pipes"><div class="pipe" id="pipe"></div><div class="pipe" id="pipeSmm"></div></div>

  <section class="panel">
    <h2>Ближайшие дедлайны</h2>
    <div class="dl" id="deadlines"></div>
  </section>

  <section>
    <div class="bar" style="justify-content:space-between;margin-bottom:10px">
      <div class="bar"><h2 style="font-family:var(--f-display);font-size:15px;font-weight:500;margin:0" id="boardTitle">Все задачи</h2>
      <div class="tabs" id="tabs" role="group" aria-label="Ветка задач"></div></div>
      <span class="status" id="dbStatus">Загружаю таблицу…</span>
    </div>
    <div class="board" id="board"></div>
  </section>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const PEOPLE = {
  me:     {name:'Никита',  role:'Монтажёр',         hair:'#2b1d14'},
  elvina: {name:'Эльвина', role:'Главный редактор', hair:'#4a2418'},
  ruslan: {name:'Руслан',  role:'Продюсер',         hair:'#1d1d1d'},
  danila: {name:'Данила',  role:'Оператор',         hair:'#6b4a2a'},
  elmira: {name:'Эльмира', role:'SMM',              hair:'#23150f'},
  claude: {name:'Claude',  role:'Ассистент монтажёра'}
};
const DESKS = ['danila','me','elvina','ruslan','elmira'];
const BRANCHES = [['all','Все'],['montage','Монтаж'],['smm','SMM']];
const branchOf = t => t.branch || (t.who==='elmira' ? 'smm' : 'montage');
let branch = 'all';
try { branch = localStorage.getItem('branch') || 'all'; } catch(e){}
const STATUSES = [['todo','Ждёт'],['doing','В работе'],['review','На проверке'],['done','Готово']];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tasks = [], db = null, readOnly = false, filter = null;

/* пивная мудрость дня: одна на календарный день, у всех одинаковая */
const BEER = [
  'Пиво не решает проблем. Но и молоко не решает.',
  'Не откладывай на завтра пиво, которое можно выпить в пятницу.',
  'Кто рано встаёт, тот первым занимает место у крана.',
  'Семь раз отмерь, один раз налей. До краёв.',
  'Пиво без пены что монтаж без склейки: вроде есть, а душа не лежит.',
  'Тише едешь — холоднее пиво довезёшь.',
  'Утро вечера мудренее, но вечер пиво разливает.',
  'Не всё то золото, что блестит. Иногда это светлое нефильтрованное.',
  'В гостях хорошо, а дома холодильник ближе.',
  'Без труда не откроешь и бутылку.',
  'Лучше синица в руке, чем пустая кружка на столе.',
  'Делу время, а пиву — после рендера.',
  'Пиво любит тишину, а монтажёр — когда никто не трогает таймлайн.',
  'Сделал дедлайн — пей смело.',
  'Не плюй в колодец, вдруг там пивоварня.',
  'Старый друг лучше новых двух. А старое пиво хуже свежего.',
  'Кружка пива в обед — до вечера бед нет. Шутка, дедлайн никто не отменял.',
  'На вкус и цвет пиво разное, а пятница одна.',
  'Пиво рекой не течёт, пока Руслан не согласовал бюджет.',
  'Где пена, там и перемены.',
  'Хлеб всему голова, а пиво — жидкий хлеб. Считай, обед.',
  'Каков монтаж, таково и пиво после сдачи.',
  'Работа не волк, в лес не убежит. Пиво тоже, но оно греется.',
  'Сколько пиву ни стоять, а холоднее без холодильника не станет.',
  'Не тот пьёт, кто наливает, а тот, кто успел сдать до пятницы.',
  'Мал рендер, да долог. Как раз на одну кружку.',
  'Умный в гору не пойдёт, умный в бар пойдёт.',
  'Кто не рискует, тот пьёт тёмное с тёмным.',
  'Правки любят счёт, а пиво — дружную компанию.',
  'Одна голова хорошо, а две кружки лучше.',
  'Финальный экспорт прошёл без ошибок — значит, сегодня можно.'
];
function beerOfDay(){
  const d = new Date();
  const day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
  return BEER[((day * 7) % BEER.length + BEER.length) % BEER.length];
}
function showBeer(){ $('#beer').textContent = beerOfDay(); }
showBeer();
setInterval(showBeer, 600000); // в полночь сменится сама

/* pipeline legend */
$('#pipe').innerHTML = [['danila','снял, залил на Яндекс Диск'],['claude','скачал, разложил по планам, сделал просмотровку'],['me','собрал, добавил творчество'],['elvina','проверила, дала правки'],['ruslan','держит дедлайны, сдаёт']]
  .map(([k,t],i)=>`<span><span class="dot" style="background:var(--${k})"></span><b>${PEOPLE[k].name}</b> ${t}</span>${i<4?'<span aria-hidden="true">→</span>':''}`).join('');
$('#pipeSmm').innerHTML = '<span class="br">SMM</span> ' + [['elmira','ставит задачи по контенту: вертикалки, тизеры, обложки'],['claude','нарезает черновики по таймкодам'],['me','доводит'],['elmira','публикует']]
  .map(([k,t],i)=>`<span><span class="dot" style="background:var(--${k})"></span><b>${PEOPLE[k].name}</b> ${t}</span>${i<3?'<span aria-hidden="true">→</span>':''}`).join('');

function dueInfo(t){
  if(!t.due) return {txt:'без срока', cls:''};
  const ms = new Date(t.due) - Date.now();
  if(isNaN(ms)) return {txt:t.due, cls:''};
  const h = Math.round(ms/36e5);
  if(t.status==='done') return {txt:'сдано', cls:'fine'};
  if(ms<0) return {txt:`просрочено ${Math.abs(h)<24?Math.abs(h)+' ч':Math.round(Math.abs(h)/24)+' д'}`, cls:'late'};
  const txt = h<24 ? `через ${h} ч` : `через ${Math.floor(h/24)} д ${h%24} ч`;
  return {txt, cls: h<48 ? 'soon' : 'fine'};
}

function deskTask(k){
  const mine = tasks.filter(t=>t.who===k && t.status!=='done');
  const pick = mine.find(t=>t.status==='doing') || mine.find(t=>t.status==='review') || mine[0];
  return {pick, n: mine.length};
}

/* ===== isometric pixel office ===== */
const CW=420, CH=292, OX=178, OY=82, W=240, D=168, WALL=64;
const cv=$('#scene'), g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const P=(x,y,z=0)=>[Math.round(OX+x-y), Math.round(OY+(x+y)/2-z)];
const COL={me:'#E0702B',elvina:'#C4417F',ruslan:'#3A68C9',danila:'#3E9452',claude:'#C9A04E',elmira:'#1FA8A3'};
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.round(((n>>16)&255)*f),gg=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return `rgb(${r},${gg},${b})`;}
const tri=h=>[h,shade(h,.8),shade(h,.64)];
function poly(pts,c){g.fillStyle=c;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();}
function box(x,y,z,w,d,h,c){
  poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],c[1]);
  poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],c[2]);
  poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],c[0]);
}

function lane(p){ if(p[0]>=132) return p[1]; return p[1]<100 ? (p[1]<58?54:94) : 96; }
function route(from,to){
  if(from[0]>=132 && to[0]>=132) return [to];
  const l1=lane(from), l2=lane(to);
  if(from[0]<132 && to[0]<132 && l1===l2) return [[from[0],l1],[to[0],l1],to];
  return [[from[0],l1],[134,l1],[134,l2],[to[0],l2],to];
}
function targets(){

    else spot=IDLE[(di+phase)%IDLE.length];

    a.spot=spot;

function parseDue(s){
  const m = String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(!m) return '';
  const h = m[4]!==undefined ? +m[4] : 23, mi = m[5]!==undefined ? +m[5] : 59;
  return new Date(Date.UTC(+m[3], +m[2]-1, +m[1], h-3, mi)).toISOString(); // время в таблице московское
}
function rowsToTasks(values){
  // витрина: A ID, B Ветка, C Задача, D Тип, E Исполнитель, F Приоритет, G Дедлайн, H Статус, I Прогресс
  return values.map((r,i)=>{
    const c = k => String((r||[])[k] ?? '').trim();
    if(!c(2) && !c(3) && !c(4)) return null;
    return { id:'r'+(i+2), row:i+2, sid:c(0), branchRaw:c(1), branch:c(1)==='SMM'?'smm':'montage', project:'', title:c(2) || `${c(3)||'Задача без названия'} (строка ${i+2})`,
      type:c(3), whoRaw:c(4), who:WHO[c(4)]||'me', prio:c(5), dueRaw:c(6), due:parseDue(c(6)), statusRaw:c(7)||'Ждёт', status:ST[c(7)]||'todo',
      progress:Math.max(0,Math.min(100,parseInt(c(8),10)||0)) };
  }).filter(Boolean);
}
const fmtTime = d => d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function setStatus(t){ $('#dbStatus').textContent = t; }
let loadedOnce = false, pending = null;
window.__onSheet = function(resp){
  clearTimeout(pending);
  document.querySelectorAll('script[data-sheet]').forEach(s=>s.remove());
  if(!resp || resp.status==='error'){
    setStatus(loadedOnce ? 'Не удалось обновить, показаны последние данные.' : 'Витрина закрыта. Владелец должен открыть её на просмотр по ссылке.');
    return;
  }
  const rows = (resp.table && resp.table.rows || []).map(r => (r.c||[]).map(c => c==null ? '' : (c.f!=null ? c.f : (c.v ?? ''))));
  tasks = rowsToTasks(rows); loadedOnce = true; render();
  setStatus(`Из Google Таблицы · ${tasks.length} задач · обновлено ${fmtTime(new Date())}`);
};
function loadSheet(){
  const s = document.createElement('script');
  s.dataset.sheet = '1';
  s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:__onSheet&sheet=${encodeURIComponent('Витрина')}&headers=1&range=A1:I500&_=${Date.now()}`;
  s.onerror = ()=>{ setStatus(loadedOnce ? 'Нет связи с таблицей, показаны последние данные.' : 'Не получилось загрузить таблицу. Проверь, что она открыта на просмотр по ссылке.'); s.remove(); };
  pending = setTimeout(()=>{ if(!loadedOnce) setStatus('Таблица не отвечает. Проверь, что она открыта на просмотр по ссылке.'); }, 15000);
  document.head.appendChild(s);
}
loadSheet();
setInterval(()=>{ if(!document.hidden) loadSheet(); }, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) loadSheet(); });
</script>
